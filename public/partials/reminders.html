<!-- Hatırlatmalar sayfası -->
<div id="remindersPage" style="display:none;">
  <div class="archive-topbar">
    <div class="topbar-row">
      <h2 class="archive-heading">Hatırlatmalar</h2>
      <span class="rem-sub">Tarihli hatırlatmalar; isterseniz saat verin ve bir işe bağlayın. Tarihsiz notlar için "Notlarım".</span>
      <div class="spacer"></div>
      <button type="button" class="btn btn-sm" id="btnNotifyPerm" style="display:none;" title="Saati gelen hatırlatmalar için masaüstü bildirimi göster">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        Masaüstü bildirimlerine izin ver
      </button>
    </div>
    <div class="rem-add">
      <textarea id="rText" rows="2" maxlength="2000" placeholder="Neyi hatırlatayım? (Enter ekler, Shift+Enter yeni satır)"></textarea>
      <div class="rem-form-row">
        <div class="date-field">
          <input type="text" id="rDate" placeholder="Bugün" title="Tarih (gg.aa.yyyy). Boş bırakılırsa bugün." inputmode="numeric" maxlength="10" autocomplete="off" />
          <button type="button" class="date-pick" data-pick="rDate" title="Takvimden seç" aria-label="Takvimden seç">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
          </button>
          <input type="date" class="date-native" id="rDatePicker" tabindex="-1" aria-hidden="true" />
        </div>
        <input type="time" id="rTime" title="Saat (isteğe bağlı) — saati gelince bildirim gösterilir" />
        <select id="rTask" title="İsteğe bağlı: bir işe bağlayın"></select>
        <span class="spacer"></span>
        <button type="button" class="btn btn-primary btn-sm" id="btnAddReminder">Ekle</button>
      </div>
    </div>
  </div>
  <div class="archive-wrap">
    <div class="rem-list" id="remList"></div>
    <div class="archive-empty" id="remEmpty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <h3>Henüz hatırlatma yok</h3>
      <p>Yukarıdan tarihli bir hatırlatma ekleyin. Saat verirseniz, sayfa açıkken zamanı gelince bildirim gösterilir.</p>
    </div>
  </div>
</div>
