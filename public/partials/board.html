<!-- Pano: üst çubuk, durum sekmeleri, uyarılar, kart ızgarası -->
<div id="boardPage">
<div class="topbar">
  <div class="topbar-row">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="Başlık, açıklama, notlarda ara…" />
    </div>
    <div class="spacer"></div>
    <button type="button" class="btn btn-ai" id="btnAi" title="AI asistanı aç/kapat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg>
      AI Asistan
    </button>
    <button class="btn btn-primary" id="btnNewTask">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      Yeni İş
    </button>
  </div>

  <div class="status-tabs" id="pipeline" role="tablist" aria-label="Durum sekmeleri"></div>
</div>

<div class="alerts" id="alertBanner">
  <div class="alerts-bar">
    <span class="alerts-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
    </span>
    <span class="alerts-title">Dikkat gereken işler</span>
    <div class="alerts-chips" id="alertChips"></div>
    <div class="spacer"></div>
    <button type="button" class="alerts-toggle" id="alertsToggle" aria-expanded="false">
      <span id="alertsToggleText">Ayrıntılar</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
  </div>
  <div class="alerts-panel" id="alertPanel"></div>
</div>

<div class="board-wrap">
  <div class="board" id="board"></div>
  <div class="empty-state" id="emptyState">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
    <h3>Filtreyle eşleşen iş yok</h3>
    <p>Farklı bir sorumlu, öncelik veya proje seçin, aramayı temizleyin ya da yeni bir iş oluşturun.</p>
    <button class="btn btn-primary" id="btnEmptyNew">Yeni İş Oluştur</button>
  </div>
</div>
</div>
