<!-- Pano AI asistanı paneli -->
<aside class="ai-panel" id="aiPanel" aria-hidden="true" aria-label="AI asistan">
  <div class="ai-head">
    <div class="ai-head-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg>
      <div class="ai-head-text"><b>AI Asistan</b>
        <select id="aiModel" class="ai-model-select" title="Kullanılacak model" aria-label="Kullanılacak model"></select>
      </div>
    </div>
    <button type="button" class="ai-head-btn" id="aiNew" title="Yeni sohbet">Yeni sohbet</button>
    <button type="button" class="modal-close" id="aiClose" title="Kapat" aria-label="Kapat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="ai-messages" id="aiMessages" aria-live="polite"></div>
  <div class="ai-compose">
    <textarea id="aiInput" rows="1" placeholder="Bir istek yazın… (Enter gönderir)"></textarea>
    <button type="button" class="ai-send" id="aiSend" title="Gönder (Enter)" aria-label="Gönder">
      <svg class="i-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
      <svg class="i-stop" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
    </button>
  </div>
  <div class="ai-foot" id="aiFoot">Aktif işlerin ve yaklaşan hatırlatmaların özeti seçili modele gönderilir; notlarınız yalnızca asistan onları aradığında gönderilir. Sohbet kaydedilmez.</div>
</aside>
