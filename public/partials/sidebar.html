<!-- Kenar çubuğu: gezinme, filtreler, yedek düğmeleri, kayıt durumu -->
<aside class="sidebar">
  <div class="brand">
    <div class="brand-role">Veri Mimarisi ve Altyapı Müdürlüğü</div>
    <div class="brand-title">İş Takip</div>
    <div class="brand-sub">Kişisel &amp; Birim İşleri Panosu</div>
  </div>

  <div class="view-switch">
    <button type="button" class="view-tab active" id="tabBoard" data-view="board">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="18" rx="1.5"/><rect x="14" y="3" width="7" height="10" rx="1.5"/></svg>
      Pano
    </button>
    <button type="button" class="view-tab" id="tabCalendar" data-view="calendar" title="Aylık ve haftalık takvim: işler ve hatırlatmalar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
      Takvim
    </button>
    <button type="button" class="view-tab" id="tabProjects" data-view="projects" title="Proje sayfaları: notlar, dosyalar, işler">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
      Projeler
      <span class="view-count" id="projCountBadge" style="display:none;">0</span>
    </button>
    <button type="button" class="view-tab" id="tabReminders" data-view="reminders" title="Tarihli hatırlatmalar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      Hatırlatma
      <span class="view-count due" id="remCountBadge" style="display:none;" title="Bugün ve gecikmiş hatırlatmalar">0</span>
    </button>
    <button type="button" class="view-tab" id="tabMemos" data-view="memos" title="Tarihsiz kişisel notlar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h13l3 3v13H4z"/><path d="M8 9h9M8 13h9M8 17h5"/></svg>
      Notlarım
      <span class="view-count" id="memoCountBadge" style="display:none;">0</span>
    </button>
    <button type="button" class="view-tab" id="tabArchive" data-view="archive">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8"/><path d="M10 13h4"/></svg>
      Arşiv
      <span class="view-count" id="archiveCountBadge">0</span>
    </button>
    <button type="button" class="view-tab" id="tabSettings" data-view="settings" title="Ayarlar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      Ayarlar
    </button>
  </div>

  <div class="side-section side-filter" id="unitFilter">
    <div class="side-head">
      <button type="button" class="side-toggle" aria-expanded="true" aria-controls="unitList"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg><span class="side-label">Sorumlu</span></button>
      <span class="side-active" id="unitActive"></span>
    </div>
    <div class="side-body">
      <label class="side-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input type="text" id="unitSearch" placeholder="Ekip ya da çalışan ara…" autocomplete="off" spellcheck="false" /></label>
      <div class="side-list" id="unitList"></div>
    </div>
  </div>

  <div class="side-section">
    <div class="side-label">Öncelik</div>
    <div class="prio-row" id="prioFilterRow"></div>
  </div>

  <div class="side-section side-filter" id="projectFilter">
    <div class="side-head">
      <button type="button" class="side-toggle" aria-expanded="true" aria-controls="projectList"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg><span class="side-label">Proje</span></button>
      <span class="side-active" id="projectActive"></span>
    </div>
    <div class="side-body">
      <label class="side-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input type="text" id="projectSearch" placeholder="Proje ara…" autocomplete="off" spellcheck="false" /></label>
      <div class="side-list" id="projectList"></div>
    </div>
  </div>

  <div class="sidebar-footer">
    <div class="save-status" id="saveStatus"><span class="status-dot"></span><span>Yükleniyor…</span></div>
    <div class="storage-note" id="storageNote">Veriler sunucudaki <b>data/is-takip.db</b> veritabanına otomatik yazılır. Tam yedek (ekler dahil): <b>Ayarlar → Veri ve yedek</b>.</div>
  </div>
</aside>
