<!-- İş penceresi -->
<div class="overlay" id="overlay">
  <div class="modal modal-wide">
    <div class="modal-head">
      <div style="flex:1;">
        <div class="modal-title" id="modalTitle">Yeni İş</div>
        <div class="modal-entry-date" id="modalEntryDate"></div>
      </div>
      <button class="modal-close" id="modalClose">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label for="fTitle">Başlık</label>
        <input type="text" id="fTitle" placeholder="Örn. Veri kalitesi kontrol raporu hazırlanması" />
      </div>
      <div class="field">
        <label>Açıklama</label>
        <div id="fDescEditor"></div>
        <div class="att-list" id="attList"></div>
        <input type="file" id="attInput" class="file-hidden" multiple />
      </div>
      <div class="field">
        <label>Durum Notları</label>
        <div class="notes-list" id="notesList"></div>
        <div class="note-add-row">
          <textarea id="fNoteInput" placeholder="İşin şu anki durumuna dair bir not ekleyin…"></textarea>
          <button type="button" class="btn btn-sm" id="btnAddNote">Ekle</button>
        </div>
      </div>
      <div class="field" id="fRemField">
        <label>Hatırlatmalar ve notlarım</label>
        <div class="modal-rem-list" id="modalRemList"></div>
        <div class="modal-rem-btns">
          <button type="button" class="btn btn-sm" id="btnTaskReminder" title="Hatırlatmalar sayfasını bu iş seçili olarak açar (değişiklik varsa önce kaydeder)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
            Hatırlatma ekle
          </button>
          <button type="button" class="btn btn-sm" id="btnTaskMemo" title="Notlarım sayfasını bu iş seçili olarak açar (değişiklik varsa önce kaydeder)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h13l3 3v13H4z"/><path d="M8 9h9M8 13h9M8 17h5"/></svg>
            Not ekle
          </button>
        </div>
      </div>
      <div class="field">
        <label>Sorumlular <span class="opt-mark">(ekip ve isteğe bağlı çalışan)</span></label>
        <div id="fAssignees"></div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Proje <span class="opt-mark">(opsiyonel)</span></label>
          <div id="fProject"></div>
        </div>
        <div class="field">
          <label for="fStatus">Durum</label>
          <select id="fStatus"></select>
        </div>
      </div>
      <div class="field">
        <label>Öncelik</label>
        <div class="seg" id="fPrioSeg"></div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="fStart" id="lblStart">Başlangıç Tarihi</label>
          <div class="date-field">
            <input type="text" id="fStart" placeholder="gg.aa.yyyy" inputmode="numeric" maxlength="10" autocomplete="off" />
            <button type="button" class="date-pick" data-pick="fStart" title="Takvimden seç" aria-label="Takvimden seç">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
            </button>
            <input type="date" class="date-native" id="fStartPicker" tabindex="-1" aria-hidden="true" />
          </div>
        </div>
        <div class="field">
          <label for="fDue" id="lblDue">Bitiş / Termin Tarihi</label>
          <div class="date-field">
            <input type="text" id="fDue" placeholder="gg.aa.yyyy" inputmode="numeric" maxlength="10" autocomplete="off" />
            <button type="button" class="date-pick" data-pick="fDue" title="Takvimden seç" aria-label="Takvimden seç">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
            </button>
            <input type="date" class="date-native" id="fDuePicker" tabindex="-1" aria-hidden="true" />
          </div>
        </div>
      </div>
      <div class="field" id="backlogHint" style="display:none;">
        <span style="font-size:11.5px; color:var(--text-faint); line-height:1.5;">Backlog ve İptal Edildi durumlarında tarih girmek zorunlu değildir. İşi Beklemede, Devam Ediyor veya Tamamlandı durumuna taşıdığınızda başlangıç ve bitiş tarihi istenecektir.</span>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="btnDeleteTask" style="color:#9A3B1F; border-color:#F0B79E; display:none;">Sil</button>
      <button class="btn" id="btnMailTask" style="display:none;" title="Kaydeder ve bu iş için Outlook mail taslağı oluşturur">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        Mail taslağı
      </button>
      <div class="spacer"></div>
      <button class="btn" id="btnCancel">Vazgeç</button>
      <button class="btn btn-primary" id="btnSaveTask">Kaydet</button>
    </div>
  </div>
</div>
